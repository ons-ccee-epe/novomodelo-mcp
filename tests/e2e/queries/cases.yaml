    status: ok
    did_not_use: [Read]
  tags: [deck, describe, parquet]

- id: deck-edit-parquet
  query: No arquivo scenarios/inflow_seasonal_stats.parquet do caso {caso:exemplo_1dtoy}, altere mean_m3s para 45 na linha com stage_id 0
  expected:
