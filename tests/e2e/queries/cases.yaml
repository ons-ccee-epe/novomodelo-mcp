# ============================================================================
# novomodelo-mcp: casos por tool
# ============================================================================
# Cada caso manda um pedido em linguagem natural ao agente, pelo executor em
# container (tests/e2e/conjuntos/tools/adaptador.py), e o validador confere:
# - se a tool MCP esperada foi chamada;
# - o envelope que a tool devolveu no stream do agente (status, content,
#   error_contains, que procura em `diagnostics`);
# - se o agente não usou tools nativas no lugar do MCP (did_not_use, com os
#   nomes do Claude; os do Kiro são normalizados pelo validador).
#
# Caso público: o marcador {caso:<nome lógico>} no pedido vira
# /estudos/<nome lógico>, uma cópia do caso que o executor monta. Só os nomes
# de tests.e2e.executor.casos.PUBLICOS são aceitos, um por caso. A pasta de
# trabalho do MCP no container é /estudos.
#
# Tools que pedem aprovação (as que gravam, as destrutivas e as de rede) são
# negadas no container, que roda com as permissões do `configurar`: o caso
# delas confere só a chamada, porque o envelope não chega.
#
# O status do bridge (ok, warnings, will-not-convert) não é o do envelope de
# erro do MCP: ele é conferido em content.status.
# ============================================================================

defaults:
  # Timeout (s) da sessão inteira do agente num caso. Precedência:
  # timeout_s do caso > timeout_s_by_group (grupo da tool esperada) > timeout_s.
  # O bridge leva 12-28 s só para subir a CLI, antes de ler o deck; o limite do
  # grupo abrange uma chamada inteira do MCP (NOVOMODELO_MCP_TIMEOUT, 900 s).
  timeout_s: 300
  timeout_s_by_group:
    bridge: 900

cases:

# ============================================================================
# BRIDGE - bridge_check_*, bridge_convert_*, bridge_compare_*, bridge_dashboard
# ============================================================================

- id: bridge-check-newave-valid
  query: Valide o caso NEWAVE em {caso:bridge_newave_mini}
  expected:
    uses_mcp: true
    tool: bridge_check_newave
    status: ok
  tags: [bridge, newave, validation]

- id: bridge-check-newave-invalid-path
  query: Valide o caso NEWAVE em /estudos/caso-newave-inexistente
  expected:
    uses_mcp: true
    tool: bridge_check_newave
    content:
      status: will-not-convert
    error_contains: "source-file-missing"
  tags: [bridge, newave, validation, error]

- id: bridge-check-decomp-valid
  query: Valide o caso DECOMP em {caso:bridge_decomp_mini}
  expected:
    uses_mcp: true
    tool: bridge_check_decomp
    content:
      status: "__matches__:^(ok|warnings)$"
  tags: [bridge, decomp, validation]

- id: bridge-check-decomp-invalid-path
  query: Verifique a validade do deck DECOMP em /estudos/caso-decomp-inexistente
  expected:
    uses_mcp: true
    tool: bridge_check_decomp
    content:
      status: will-not-convert
    error_contains: "source-file-missing"
  tags: [bridge, decomp, validation, error]

- id: bridge-convert-newave
  query: Converta o caso NEWAVE em {caso:bridge_newave_mini} para um deck do novomodelo em /estudos/convertido-newave
  expected:
    uses_mcp: true
    tool: bridge_convert_newave
  tags: [bridge, newave, conversion]

- id: bridge-convert-decomp
  query: Converta o caso DECOMP em {caso:bridge_decomp_mini} para um deck do novomodelo em /estudos/convertido-decomp
  expected:
    uses_mcp: true
    tool: bridge_convert_decomp
  tags: [bridge, decomp, conversion]

- id: bridge-compare-newave-saida
  query: Compare os resultados do NEWAVE em {caso:bridge_newave_mini} com a saída da rodada do novomodelo na pasta output desse mesmo caso
  expected:
    uses_mcp: true
    tool: bridge_compare_newave
  tags: [bridge, newave, comparison]

- id: bridge-compare-decomp-saida
  query: Compare os resultados do DECOMP em {caso:bridge_decomp_mini} com a saída da rodada do novomodelo na pasta output desse mesmo caso
  expected:
    uses_mcp: true
    tool: bridge_compare_decomp
  tags: [bridge, decomp, comparison]

- id: bridge-dashboard-generate
  query: Gere um dashboard HTML dos resultados do caso {caso:exemplo_1dtoy_rodado}
  expected:
    uses_mcp: true
    tool: bridge_dashboard
  tags: [bridge, dashboard]

