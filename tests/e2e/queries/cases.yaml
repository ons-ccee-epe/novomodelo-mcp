  expected:
    uses_mcp: true
    tool: deck_list
    status: ok
    content:
      count: "__gt__:0"
    did_not_use: [Read, Glob, LS]
  tags: [deck, list]

- id: deck-list-rodado
  query: Quais arquivos existem no deck do caso {caso:exemplo_1dtoy_rodado}?
  expected:
    uses_mcp: true
    tool: deck_list
    status: ok
    did_not_use: [Read, Glob, LS]
  tags: [deck, list]

- id: deck-read-parquet-inflow
  query: Leia o arquivo scenarios/inflow_seasonal_stats.parquet do caso {caso:exemplo_1dtoy}
  expected:
