# ============================================================================
# <repositório anterior> Query E2E Test Cases
# ============================================================================
# Este arquivo define os casos de teste E2E via query para o framework.
# Cada caso envia uma query em linguagem natural ao Kiro CLI e valida:
# - Se a tool MCP correta foi chamada
# - Se o resultado está correto
# - Se o agente não usou tools nativas (read_file, list_directory) quando
#   deveria usar o MCP
#
# Variáveis suportadas:
#   {FIXTURES} - Expande para o caminho absoluto do diretório de fixtures
#                (newave/, decomp/, scratch/ — ver tests/e2e/README.md).
#                O runner confina o MCP novomodelo a esse diretório
#                (queries/mcp_workspace.py): caminhos fora dele são recusados.
#
# Total: ~60 casos cobrindo todas as 37 MCP_Tools
# ============================================================================

defaults:
  # Timeout (s) da sessão inteira do agente num caso. Precedência:
  # timeout_s do caso > timeout_s_by_group (grupo da tool esperada) > timeout_s.
  # O bridge leva 12-28 s só para subir a CLI, antes de ler o deck; o limite do
  # grupo cobre uma chamada inteira do MCP (NOVOMODELO_MCP_TIMEOUT, 900 s).
  timeout_s: 300
  timeout_s_by_group:
    bridge: 900

cases:

# ============================================================================
