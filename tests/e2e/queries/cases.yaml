- id: deck-read-json-config
  query: Leia o arquivo config.json do caso {caso:exemplo_1dtoy}
  expected:
    uses_mcp: true
    tool: deck_read_json
    status: ok
    did_not_use: [Read]
  tags: [deck, read, json]

- id: deck-read-json-penalties
  query: Mostre o conteúdo de penalties.json do caso {caso:exemplo_1dtoy}
  expected:
    uses_mcp: true
    tool: deck_read_json
    status: ok
    did_not_use: [Read]
  tags: [deck, read, json]

- id: deck-edit-json
  query: No caso {caso:exemplo_1dtoy}, altere o custo de vertimento (spillage_cost) das hidrelétricas em penalties.json para 0.02
  expected:
    uses_mcp: true
    tool: deck_edit_json
  tags: [deck, edit, json]

- id: deck-sql-query
  query: Execute a consulta SQL "SELECT * FROM read_parquet('{caso:exemplo_1dtoy}/scenarios/inflow_seasonal_stats.parquet') LIMIT 10"
  expected:
    uses_mcp: true
    tool: deck_sql
    status: ok
    did_not_use: [Read]
  tags: [deck, sql]

- id: deck-sql-invalid
  query: Execute a consulta SQL "SELECT * FROM tabela_inexistente"
  expected:
    uses_mcp: true
    tool: deck_sql
    status: error
    error_contains: "CatalogException"
  tags: [deck, sql, error]

