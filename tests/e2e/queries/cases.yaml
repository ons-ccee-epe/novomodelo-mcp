    tool: deck_read_parquet
    status: ok
    did_not_use: [Read]
  tags: [deck, read, parquet]

- id: deck-read-parquet-invalid
  query: Leia o arquivo inexistente.parquet do caso {caso:exemplo_1dtoy}
  expected:
    uses_mcp: true
    tool: deck_read_parquet
    status: error
    error_contains: "falha ao ler Parquet"
  tags: [deck, read, parquet, error]

- id: deck-describe-parquet
  query: Descreva o schema e as estatísticas do arquivo scenarios/load_seasonal_stats.parquet no caso {caso:exemplo_1dtoy}
  expected:
    uses_mcp: true
