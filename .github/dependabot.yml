# TEMPORÁRIO: existe só enquanto o MCP vive fora do repo do novomodelo e
# consome a novomodelo-python do PyPI. Na migração para o monorepo, apagar a
# entrada "uv" (a versão passa a subir junto com o release do novomodelo).
#
# Dependabot: abre PRs para a develop quando sai versão nova.
# Atenção: o GitHub só lê este arquivo na branch padrão do repositório.
version: 2
updates:
  # novomodelo-python e novomodelo-bridge andam juntas com o release do
  # novomodelo (pins exatos no pyproject; o bridge fixa a mesma versão da
  # python), então sobem no mesmo PR. Só elas: as demais dependências seguem o
  # uv.lock até um bump deliberado. Ao aceitar, subir também o `ref` do job
  # rename-guard no CI.
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "daily"
    allow:
      - dependency-name: "novomodelo-python"
      - dependency-name: "novomodelo-bridge"
    groups:
      novomodelo:
        patterns:
          - "novomodelo-python"
          - "novomodelo-bridge"
    commit-message:
      prefix: "build"

  # Versões das actions usadas no CI (checkout, setup-uv).
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
