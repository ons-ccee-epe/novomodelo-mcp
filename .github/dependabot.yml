# Dependabot: abre PRs para a develop quando sai versão nova.
# Atenção: o GitHub só lê este arquivo na branch padrão do repositório.
version: 2
updates:
  # Só o novomodelo-bridge, que anda junto com o release do novomodelo (pin
  # exato no pyproject). Ele fixa a mesma versão da novomodelo-python, que sobe
  # junto no uv.lock: por isso a python fica sem pin e fora desta lista (o
  # Dependabot atualiza uma dependência por vez, e um bump isolado de uma das
  # duas não resolve). As demais dependências seguem o uv.lock até um bump
  # deliberado. O PR do bridge é o aviso para o commit de pareamento
  # (CONTRIBUTING.md, "Parear com uma versão do novomodelo").
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "daily"
    allow:
      - dependency-name: "novomodelo-bridge"
    commit-message:
      prefix: "build"

  # Versões das actions usadas no CI. Elas ficam fixadas por SHA, com a versão em
  # comentário; o Dependabot atualiza os dois juntos.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Painel da bateria e2e: dependências de desenvolvimento, fora do pacote. Uma PR
  # por semana com todas as atualizações juntas.
  - package-ecosystem: "npm"
    directory: "/e2e/frontend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      painel:
        patterns: ["*"]
    commit-message:
      prefix: "build"

# Correções de segurança das dependências Python do pacote (as que seguem o uv.lock)
# chegam pelos alertas e pelas atualizações de segurança do Dependabot, ligados nas
# configurações do repositório (Code security), e não por este arquivo.
