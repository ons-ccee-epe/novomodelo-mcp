name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff + gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.13"

      # --locked: falha se o uv.lock não corresponder ao pyproject.toml.
      - name: Sincronizar dependências
        run: uv sync --dev --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Formatação (ruff format)
        run: uv run ruff format --check .

      # Convenções em .claude/rules/; cada gate está descrito no CONTRIBUTING.md.
      - name: Sem vocabulário de plano
        run: python3 scripts/ci/check_no_plan_leaks.py

      - name: Sem referência que apodrece na prosa do código
        run: python3 scripts/ci/check_comment_refs.py

      - name: Todo caminho citado nas docs existe
        run: python3 scripts/ci/check_doc_paths.py

  publico:
    # Repositório público: nenhum segredo no histórico e nenhum termo proibido na árvore.
    name: Segredos e termos proibidos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar o gitleaks (checksum fixado)
        run: |
          arquivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$arquivo" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$arquivo"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$arquivo" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$arquivo" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Segredos no histórico inteiro (gitleaks)
        run: gitleaks git --redact --no-banner .

      # As regras padrão do gitleaks não reconhecem o token OAuth do Claude: a regra do
      # .gitleaks.toml tem de acusar os três formatos, ou o job falha.
      - name: A config do gitleaks acusa os tokens falsos da Anthropic
        run: |
          pasta="$(mktemp -d)"
          mkdir "$pasta/tokens"
          for formato in oat api admin; do
            printf 'eco sk-ant-%s01-%s\n' "$formato" "FalsoDeTesteDaCi00000000" > "$pasta/tokens/$formato.txt"
          done
          set +e
          gitleaks dir --redact --no-banner --config .gitleaks.toml --exit-code 1 \
            --report-format json --report-path "$pasta/achados.json" "$pasta/tokens"
          codigo=$?
          set -e
          test "$codigo" -eq 1
          python3 -c 'import json, sys; n = len(json.load(open(sys.argv[1]))); sys.exit(0 if n == 3 else f"esperados 3 achados, vieram {n}")' "$pasta/achados.json"

      # O histórico antigo ainda tem termos até a limpeza; até lá a CI olha só a árvore.
      - name: Termos proibidos na árvore
        run: python3 scripts/ci/check_termos_proibidos.py

  painel:
    name: painel (lint, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: e2e/frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Mesma versão do engines.node do package.json.
      - name: Instalar o Node
        uses: actions/setup-node@v7
        with:
          node-version: "25.9.0"

      - name: Instalar dependências (npm ci)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm run test

      - name: Build
        run: npm run build

  test:
    # Os alvos e as versões do Python que o projeto suporta.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: ${{ matrix.python }}

      - name: Sincronizar dependências
        run: uv sync --dev --locked

      - name: Sintaxe (compileall)
        run: uv run python -m compileall -q src

      - name: Testes (pytest)
        run: uv run pytest -q

  e2e:
    # A bateria de ponta a ponta (e2e/) é um membro próprio do workspace do uv, com as
    # dependências dela; o pytest padrão só coleta tests/, então só este job a roda.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    name: e2e (${{ matrix.os }}, Python ${{ matrix.python }})
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Instalar uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: ${{ matrix.python }}

      - name: Sincronizar dependências
        run: uv sync --package novomodelo-mcp-e2e --locked

      - name: Testes (pytest e2e)
        run: uv run --package novomodelo-mcp-e2e pytest e2e -q

  executaveis-reais:
    # Todas as tools contra o executável novomodelo, o novomodelo-bridge e o
    # novomodelo-python reais da versão esperada (o pin do bridge), em cada alvo.
    # O executável vem pela própria tool install_novomodelo (instalador oficial, hash
    # conferido); os decks são os mínimos do bridge na tag da versão.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    name: Executáveis reais (${{ matrix.os }})
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.12"

      - name: Sincronizar dependências
        run: uv sync --dev --locked

      - name: Versão esperada
        id: versao
        run: echo "v=$(uv run python -c 'from novomodelo_mcp.adapters.versions import expected_version; print(expected_version())')" >> "$GITHUB_OUTPUT"

      - name: Decks mínimos do novomodelo-bridge na tag
        uses: actions/checkout@v7
        with:
          repository: ons-ccee-epe/novomodelo-bridge
          ref: v${{ steps.versao.outputs.v }}
          path: _bridge
          sparse-checkout: tests/decks
          persist-credentials: false

      - name: Testes com os executáveis reais (pytest)
        # A ordem dos arquivos importa: o primeiro instala o executável que o solver real usa.
        run: >
          uv run pytest -rs tests/test_executaveis_reais.py tests/test_run_ciclo.py
          --executaveis-reais --com-rede --instalar-executavel --bridge-repo _bridge

  rename-guard:
    # Falha se o nome antigo do produto reaparecer fora das exceções do mapa.
    # Usa a ferramenta do novomodelo (fonte única), fixada numa tag: o commit de
    # pareamento sobe o `ref` junto com o pin do novomodelo-bridge.
    name: Trava de nome (rebrand check)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Ferramenta de rename do novomodelo (fixada na tag)
        uses: actions/checkout@v7
        with:
          repository: ons-ccee-epe/novomodelo
          ref: v0.19.1
          path: _upstream
          sparse-checkout: scripts/rebrand
          persist-credentials: false

      - name: rebrand.py check
        run: python3 _upstream/scripts/rebrand/rebrand.py check --root . --map scripts/rebrand/map.toml

  docs-embutidas:
    # Falha se `src/novomodelo_mcp/_bundled/` (páginas resolvidas, schemas, índice,
    # manifesto) divergir do que o sync_bundled gera a partir do commit das docs
    # gravado no manifesto. Para atualizar: rodar o sync_bundled e commitar o diff.
    name: Docs embutidas iguais à fonte
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Commit das docs gravado no manifesto
        id: manifesto
        run: echo "commit=$(python3 -c "import json;print(json.load(open('src/novomodelo_mcp/_bundled/manifest.json'))['docs_commit'])")" >> "$GITHUB_OUTPUT"

      - name: novomodelo-docs nesse commit
        uses: actions/checkout@v7
        with:
          repository: ons-ccee-epe/novomodelo-docs
          ref: ${{ steps.manifesto.outputs.commit }}
          path: _docs
          persist-credentials: false

      - name: Commits dos changelogs gravados no manifesto
        id: changelogs
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          c = json.load(open("src/novomodelo_mcp/_bundled/manifest.json"))["changelogs"]
          print(f"novomodelo={c['novomodelo']['commit']}")
          print(f"bridge={c['novomodelo-bridge']['commit']}")
          PY

      - name: novomodelo nesse commit (CHANGELOG.md)
        uses: actions/checkout@v7
        with:
          repository: ons-ccee-epe/novomodelo
          ref: ${{ steps.changelogs.outputs.novomodelo }}
          path: _novomodelo
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: novomodelo-bridge nesse commit (CHANGELOG.md)
        uses: actions/checkout@v7
        with:
          repository: ons-ccee-epe/novomodelo-bridge
          ref: ${{ steps.changelogs.outputs.bridge }}
          path: _bridge
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: sync_bundled --check
        run: >
          python3 scripts/sync_bundled.py --source _docs
          --changelog novomodelo=_novomodelo --changelog novomodelo-bridge=_bridge --check
