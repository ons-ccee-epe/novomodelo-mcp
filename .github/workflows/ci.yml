name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          python-version: "3.12"

      - name: Sincronizar dependências
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Sintaxe (compileall)
        run: uv run python -m compileall src

      - name: Testes (pytest)
        run: uv run pytest -q
