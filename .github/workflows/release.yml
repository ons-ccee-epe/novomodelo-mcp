name: Release

# Tag `v<versão>` (a do pyproject) num commit da main: tira as notas do release da seção
# da versão no CHANGELOG.md, confere as docs embutidas, gera o wheel e o sdist, roda os
# testes contra o wheel, confere a instalação limpa em cada alvo e versão do Python
# suportados e, só no repositório público, publica no PyPI e no release do GitHub.
# O ensaio faz tudo, menos publicar (os arquivos ficam como artefato da execução): push
# numa branch `ensaio/**`, ou `workflow_dispatch`, que o GitHub só oferece depois que
# este arquivo estiver na branch padrão.

on:
  push:
    tags: ["v*"]
    branches: ["ensaio/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Pacote
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.versao.outputs.version }}
    steps:
      # Histórico inteiro: a conferência da tag precisa da origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.12"

      - name: Versão do pyproject (e a da tag)
        id: versao
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::a tag $GITHUB_REF_NAME não bate com a versão do pyproject ($version)"
            exit 1
          fi

      # Fora do checkout: o sdist leva os arquivos soltos da pasta.
      - name: Notas do release (a seção da versão no CHANGELOG.md)
        env:
          VERSAO: ${{ steps.versao.outputs.version }}
        run: python3 scripts/notas_da_release.py "$VERSAO" > "$RUNNER_TEMP/notas.md"

      # O sync leva ao público toda tag, aponte ela para onde for, e o PyPI não aceita
      # a mesma versão duas vezes: só sai versão de commit que está na main.
      - name: A tag está na main
        if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::a tag $GITHUB_REF_NAME ($(git rev-parse --short HEAD)) não está na main"
            exit 1
          fi

      - name: Commit das docs gravado no manifesto
        id: manifesto
        run: echo "commit=$(python3 -c "import json;print(json.load(open('src/novomodelo_mcp/_bundled/manifest.json'))['docs_commit'])")" >> "$GITHUB_OUTPUT"

      - name: novomodelo-docs nesse commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ons-ccee-epe/novomodelo-docs
          ref: ${{ steps.manifesto.outputs.commit }}
          path: _docs
          persist-credentials: false

      - name: Commits dos changelogs gravados no manifesto
        id: changelogs
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          c = json.load(open("src/novomodelo_mcp/_bundled/manifest.json"))["changelogs"]
          print(f"novomodelo={c['novomodelo']['commit']}")
          print(f"bridge={c['novomodelo-bridge']['commit']}")
          PY

      - name: novomodelo nesse commit (CHANGELOG.md)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ons-ccee-epe/novomodelo
          ref: ${{ steps.changelogs.outputs.novomodelo }}
          path: _novomodelo
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: novomodelo-bridge nesse commit (CHANGELOG.md)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ons-ccee-epe/novomodelo-bridge
          ref: ${{ steps.changelogs.outputs.bridge }}
          path: _bridge
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Docs embutidas iguais à fonte
        run: >
          python3 scripts/sync_bundled.py --source _docs
          --changelog novomodelo=_novomodelo --changelog novomodelo-bridge=_bridge --check

      - name: Wheel e sdist
        run: |
          uv build --out-dir dist
          cd dist && sha256sum ./*.whl ./*.tar.gz | sed 's# \./# #' > SHA256SUMS && cat SHA256SUMS

      # Os testes importam o wheel instalado, não o src/: a instalação editável passaria
      # com um arquivo que o wheel deixa de fora. O `pythonpath` do pyproject põe o src/
      # na frente; aqui fica só o tests/.
      - name: Testes contra o wheel
        run: |
          uv sync --dev --locked --no-install-project
          uv pip install --no-deps dist/novomodelo_mcp-${{ steps.versao.outputs.version }}-py3-none-any.whl
          uv run --no-sync python -c "import novomodelo_mcp as m; print(m.__file__); assert 'site-packages' in m.__file__"
          uv run --no-sync pytest -q -o pythonpath=tests

      - name: Toda dependência tem wheel em cada alvo e versão do Python
        run: scripts/conferir_wheels.sh dist/novomodelo_mcp-${{ steps.versao.outputs.version }}-py3-none-any.whl

      - name: Sdist sem regras de agente, caches, checkouts nem a bateria e2e
        run: |
          sobra=$(tar -tzf dist/*.tar.gz | cut -d/ -f2 | sort -u \
            | grep -E '^([._]|e2e$|CLAUDE\.md$|AGENTS\.md$)' | grep -vx '.gitignore' || true)
          if [ -n "$sobra" ]; then echo "::error::no sdist: $sobra"; exit 1; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: novomodelo-mcp-${{ steps.versao.outputs.version }}
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: notas-da-release-${{ steps.versao.outputs.version }}
          path: ${{ runner.temp }}/notas.md
          if-no-files-found: error

  instalacao:
    # O wheel é o mesmo em todo alvo, mas as dependências que ele puxa não: a instalação
    # limpa (sem o checkout, sem PYTHONPATH, sem o uv.lock, como a de quem usa) é conferida
    # em cada alvo e versão do Python. A falta de wheel de uma dependência é conferida no
    # job anterior (scripts/conferir_wheels.sh): o runner tem compiladores que a máquina de
    # quem usa pode não ter.
    name: Instalação limpa (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/conferir_instalacao.py
          sparse-checkout-cone-mode: false

      - name: Instalar uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: novomodelo-mcp-${{ needs.build.outputs.version }}
          path: dist

      - name: uv tool install do wheel num diretório vazio
        shell: bash
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/bin
        run: >
          uv tool install --python ${{ matrix.python }}
          dist/novomodelo_mcp-${{ needs.build.outputs.version }}-py3-none-any.whl

      - name: initialize e server_info pelo stdio
        shell: bash
        working-directory: ${{ runner.temp }}
        run: >
          uv run --no-project --python ${{ matrix.python }} python
          "$GITHUB_WORKSPACE/scripts/conferir_instalacao.py"
          --versao "${{ needs.build.outputs.version }}" --server-info
          -- "${{ runner.temp }}/bin/novomodelo-mcp"

  pypi:
    # O trusted publisher do PyPI está ligado ao repositório público, a este arquivo e ao
    # environment `pypi`: em qualquer outro repositório, o job não roda.
    name: Publicar no PyPI
    needs: [build, instalacao]
    if: github.ref_type == 'tag' && github.repository == 'ons-ccee-epe/novomodelo-mcp'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/novomodelo-mcp
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: novomodelo-mcp-${{ needs.build.outputs.version }}
          path: dist

      # O PyPI recusa o que não é distribuição.
      - name: Só o wheel e o sdist
        run: rm dist/SHA256SUMS

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  publicar:
    # Só na tag e no repositório público, como o PyPI. Se a organização não der
    # `contents: write` ao GITHUB_TOKEN, este job falha e o anexo vira passo manual
    # (CONTRIBUTING.md, "Release").
    name: Publicar no release
    needs: [build, instalacao]
    if: github.ref_type == 'tag' && github.repository == 'ons-ccee-epe/novomodelo-mcp'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: novomodelo-mcp-${{ needs.build.outputs.version }}
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: notas-da-release-${{ needs.build.outputs.version }}
          path: ${{ runner.temp }}/notas

      - name: gh release create
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "novomodelo-mcp ${{ needs.build.outputs.version }}"
          --notes-file "$RUNNER_TEMP/notas/notas.md"
