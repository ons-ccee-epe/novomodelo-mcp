# Padrões genéricos do repositório público. Nomes de casos internos não ficam aqui:
# vêm do arquivo apontado por NOVOMODELO_TERMOS_INTERNOS (uma expressão por linha).
# `escopo` restringe o padrão a prefixos de caminho; sem ele vale para o repositório todo.

[[padroes]]
nome = "<organização interna>"
regex = '\bonstec\b'

[[padroes]]
nome = "homologado ONS"
regex = 'homologad[oa] ONS'

[[padroes]]
nome = "caminho de maquina"
regex = '/home/[a-z]'

[[padroes]]
nome = "caminho de maquina"
regex = 'C:\\Users\\'

[[padroes]]
nome = "hostname"
regex = 'ip-\d+-\d+-\d+-\d+'

[[padroes]]
nome = "diretorio kiro"
regex = '[.]kiro/'

[[padroes]]
nome = "página de instalação"
regex = 'página de instalação'

[[padroes]]
nome = "nome antigo"
hex = "636f627265"

[[padroes]]
nome = "marca ONS"
regex = '\bONS\b(?!,? (?:e )?CCEE)'
escopo = ["tests/e2e/"]
sensivel_a_caixa = true

[[padroes]]
nome = "referencia de spec"
regex = '\bReq \d+\.\d+'
escopo = ["tests/e2e/"]

# Caminhos que podem conter os padrões acima, cada um com a justificativa.
[permitidos]
"scripts/ci/termos_proibidos.toml" = "a própria lista de padrões"
"src/novomodelo_mcp/_bundled/" = "docs oficiais do upstream, copiadas sem edição"
"scripts/rebrand/map.toml" = "mapa do verificador de nome: precisa citar o nome antigo"
"LICENSE" = "aviso de copyright do texto da licença upstream"
".kiro/steering/" = "regras do time versionadas para o Kiro"
"scripts/gen/sync-kiro-steering.py" = "gera .kiro/steering/"
"CLAUDE.md" = "regras do time: citam .kiro/steering/ e o gerador"
"CONTRIBUTING.md" = "descreve .kiro/steering/"
"README.md" = "caminhos de configuração do Kiro CLI (~/.kiro/settings/)"
"src/novomodelo_mcp/client_config.py" = "caminho de configuração do Kiro CLI (.kiro/settings/mcp.json)"
"tests/e2e/launcher/providers.py" = "caminho de configuração do Kiro CLI"
"tests/e2e/load/" = "caminho de configuração do Kiro CLI (.kiro/settings/mcp.json)"
"tests/e2e/queries/mcp_workspace.py" = "caminho de configuração do Kiro CLI"
