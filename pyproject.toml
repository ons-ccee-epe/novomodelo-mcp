[project]
name = "novomodelo-mcp"
version = "0.19.1"
description = "Servidor MCP (fachada local) sobre as CLIs do Novomodelo e do novomodelo-bridge"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Operador Nacional do Sistema Elétrico - ONS" },
    { name = "Câmara de Comercialização de Energia Elétrica - CCEE" },
    { name = "Empresa de Pesquisa Energética - EPE" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp>=1.2.0,<2",  # mcp 2.x renomeou FastMCP->MCPServer e quebra o import; manter <2
    "polars>=2.0",
    "jsonschema>=4.0",
    # O solver só carrega uma política gravada pela mesma versão do binding. O pin
    # exato fica só no bridge, que fixa a mesma versão do binding: assim o Dependabot
    # sobe a versão com um bump só (o binding vem junto pelo uv.lock), e
    # `versions.expected_version()` lê a versão esperada deste pin.
    "novomodelo-python",
    "novomodelo-bridge==0.19.1",
    "duckdb>=1.0",  # consulta SQL read-only sobre parquet/csv/json (deck_sql)
    "truststore>=0.10",  # HTTPS com os certificados do sistema (proxy corporativo)
    # O cryptography (via mcp -> pyjwt[crypto]) publica wheel para macOS Intel só até a
    # 48.x; sem o limite, quem instala nesse alvo compila o sdist (Rust e OpenSSL). A
    # faixa complementar obriga o uv.lock a resolver as duas versões: com uma só, ele
    # fixa a 48 em todo alvo, e a CI deixa de testar a versão que os outros alvos recebem.
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "cryptography>=49; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[project.urls]
Homepage = "https://docs.modelossetoreletrico.org.br/"
Repository = "https://github.com/ons-ccee-epe/novomodelo-mcp"
Documentation = "https://docs.modelossetoreletrico.org.br/"
"Bug Tracker" = "https://github.com/ons-ccee-epe/novomodelo-mcp/issues"

[project.scripts]
novomodelo-mcp = "novomodelo_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novomodelo_mcp"]
# Garante que o snapshot embutido (docs .md/.mdx + schemas .json) entre no wheel.
# Sem isto, o hatch empacota apenas .py e as tools de doc/schema ficariam sem
# conteudo offline.
artifacts = [
    "src/novomodelo_mcp/_bundled/**/*.md",
    "src/novomodelo_mcp/_bundled/**/*.mdx",
    "src/novomodelo_mcp/_bundled/**/*.json",
    "src/novomodelo_mcp/_bundled/**/*.sqlite",
]

[tool.hatch.build.targets.sdist]
# Fora do sdist: regras de agente, caches e os checkouts que a release faz na raiz
# (_docs, _novomodelo, _bridge). O hatchling inclui o .gitignore de qualquer jeito.
exclude = ["/.*", "/_*", "/CLAUDE.md", "/AGENTS.md"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "hypothesis>=6"]
e2e = [
    "fastapi==0.159.1",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "pyyaml==6.0.3",
    "uvicorn==0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--strict-markers", "--ignore=tests/e2e"]
markers = [
    "executaveis_reais: precisa do novomodelo e do novomodelo-bridge instalados (--executaveis-reais)",
    "rede: acessa a rede, só os domínios oficiais (--com-rede)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Regras de agente: os exemplos de código nos .md não são código do produto.
extend-exclude = [".claude", ".kiro"]

[tool.ruff.lint]
# PGH proíbe supressão em branco: todo `# noqa` e `# type: ignore` nomeia o código.
# PLW1514 (open/read_text/write_text sem `encoding`) só existe em preview; o
# `explicit-preview-rules` liga essa e nenhuma outra regra de preview.
select = ["E", "F", "I", "B", "UP", "PGH", "PLW1514"]
preview = true
explicit-preview-rules = true

[tool.ruff.lint.pycodestyle]
# O formatador quebra em 100; o E501 pega só o que ele não consegue quebrar.
max-line-length = 110
