[project]
name = "cobre-mcp"
version = "0.1.0"
description = "Servidor MCP (fachada offline) sobre as CLIs do Cobre e do cobre-bridge"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=1.2.0,<2",  # mcp 2.x renomeou FastMCP->MCPServer e quebra o import; manter <2
    "polars>=1.0",
    "jsonschema>=4.0",
    "cobre-python>=0.16",
    "duckdb>=1.0",  # consulta SQL read-only sobre parquet/csv/json (deck_sql)
]

[project.scripts]
cobre-mcp = "cobre_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cobre_mcp"]
# Garante que o snapshot embutido (docs .md/.mdx + schemas .json) entre no wheel.
# Sem isto, o hatch empacota apenas .py e as tools de doc/schema ficariam sem
# conteudo offline.
artifacts = [
    "src/cobre_mcp/_bundled/**/*.md",
    "src/cobre_mcp/_bundled/**/*.mdx",
    "src/cobre_mcp/_bundled/**/*.json",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py", "smoke_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "B", "UP"]
