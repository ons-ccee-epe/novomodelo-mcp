[project]
name = "novomodelo-mcp-e2e"
version = "0.0.0"
description = "Bateria de ponta a ponta do novomodelo-mcp: rodadas com agentes, go/no-go, carga e painel"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "novomodelo-mcp",
    "fastapi==0.159.1",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "platformdirs==4.14.0",
    "pyyaml==6.0.3",
    "uvicorn==0.54.0",
]

[dependency-groups]
# A determinística da rodada roda o pytest do repositório, além da suíte desta bateria.
dev = ["pytest>=9.2.0"]

[tool.uv.sources]
novomodelo-mcp = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["novomodelo_mcp_e2e"]

[tool.pytest.ini_options]
testpaths = ["novomodelo_mcp_e2e"]
python_files = ["test_*.py"]
addopts = ["--strict-markers"]
