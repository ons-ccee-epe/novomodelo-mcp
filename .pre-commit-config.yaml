repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: termos-proibidos
        name: termos proibidos (repo publico)
        entry: python3 scripts/ci/check_termos_proibidos.py
        language: system
        pass_filenames: false
        always_run: true
